plugins { id 'com.android.application'; id 'com.chaquo.python' }

android {
    namespace 'dev.graybridge'
    compileSdk 35
    ndkVersion '28.2.13676358'
    defaultConfig {
        applicationId 'dev.graybridge'
        minSdk 26
        targetSdk 35
        versionCode 21
        versionName '0.14.0'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        testInstrumentationRunner 'dev.graybridge.DeviceChecks'
    }
    buildFeatures { buildConfig true }
    buildTypes {
        debug { applicationIdSuffix providers.gradleProperty('startupUpdateProbe').isPresent() ? '.updateprobe' : '.dev'; versionNameSuffix '-test'; manifestPlaceholders = [appLabel: 'SorryRKN Test'] }
        release { minifyEnabled false; manifestPlaceholders = [appLabel: 'SorryRKN'] }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging { jniLibs { useLegacyPackaging true; keepDebugSymbols += ['**/libxray.so','**/libnaive.so'] } }
    sourceSets.main.jniLibs.srcDir layout.buildDirectory.dir('generated/xray/jni')
    sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/xray/assets')
    sourceSets.main.jniLibs.srcDir layout.buildDirectory.dir('generated/naive/jni')
    sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/naive/assets')
}

// Exercise the real signed production feed and offer UI from an older, isolated test APK.
androidComponents.onVariants(androidComponents.selector().withBuildType('debug')) { variant ->
    if (providers.gradleProperty('startupUpdateProbe').isPresent()) {
        variant.outputs.each { output -> output.versionCode.set(1) }
    }
}

dependencies {
    implementation 'com.github.mwiede:jsch:2.28.8'
}

chaquopy {
    defaultConfig {
        version '3.12'
        pip { install 'httpx[http2,socks]==0.28.1'; install 'certifi==2026.2.25' }
    }
}

tasks.register('buildNative', Exec) {
    workingDir rootProject.projectDir
    environment 'GRAYBRIDGE_SDK', android.sdkDirectory.absolutePath
    commandLine 'bash', 'scripts/build-native.sh'
    inputs.dir rootProject.file('native')
    inputs.file rootProject.file('scripts/build-native.sh')
    inputs.dir rootProject.file('third_party')
    outputs.dir file('src/main/jniLibs')
}
tasks.named('preBuild').configure { dependsOn 'buildNative' }
tasks.register('prepareXray', Exec) {
    workingDir rootProject.projectDir
    commandLine 'bash', 'scripts/prepare-xray.sh'
    inputs.file rootProject.file('scripts/prepare-xray.sh')
    outputs.dir layout.buildDirectory.dir('generated/xray')
}
tasks.named('preBuild').configure { dependsOn 'prepareXray' }
tasks.register('prepareNaive', Exec) {
    workingDir rootProject.projectDir
    commandLine 'bash', 'scripts/prepare-naive.sh'
    inputs.file rootProject.file('scripts/prepare-naive.sh')
    outputs.dir layout.buildDirectory.dir('generated/naive')
}
tasks.named('preBuild').configure { dependsOn 'prepareNaive' }
