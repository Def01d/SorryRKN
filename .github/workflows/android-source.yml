name: Validate Android source
on:
  push:
    branches: [main, 'codex/**']
    paths: ['android/src/**', 'services.json', '.github/workflows/android-source.yml']
  pull_request:
    paths: ['android/src/**', 'services.json', '.github/workflows/android-source.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android/src
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install pinned Android tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358"
      - name: Build unsigned package and verify both VPN engines for each ABI
        run: |
          bash gradlew --no-daemon :app:assembleRelease
          python - <<'PY'
          import pathlib, zipfile
          apk = pathlib.Path("app/build/outputs/apk/release/app-release-unsigned.apk")
          assert 0 < apk.stat().st_size <= 64 * 1024 * 1024
          with zipfile.ZipFile(apk) as package:
              for abi in ("arm64-v8a", "x86_64"):
                  for engine in ("naive", "xray"):
                      assert package.getinfo(f"lib/{abi}/lib{engine}.so").file_size > 0
              assert package.testzip() is None
          PY
  python-network:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: android/src
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install native test headers and Python dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libcap-dev zlib1g-dev
          python -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt
      - name: Build isolated native fixtures and run Python suite
        run: bash scripts/test-network.sh
