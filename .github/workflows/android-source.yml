name: Validate Android source
on:
  push:
    branches: [main, 'codex/**']
    paths: ['android/src/**', 'services.json', '.github/workflows/android-source.yml']
  pull_request:
    paths: ['android/src/**', 'services.json', '.github/workflows/android-source.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android/src
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install pinned Android tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358"
      - name: Build unsigned package and verify both VPN engines for each ABI
        run: |
          bash scripts/fetch-pinned.sh https://github.com/gradle/gradle-distributions/releases/download/v8.13.0/gradle-8.13-bin.zip 20f1b1176237254a6fc204d8434196fa11a4cfb387567519c61556e8710aed78 "$RUNNER_TEMP/gradle-8.13.zip"
          unzip -q "$RUNNER_TEMP/gradle-8.13.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/gradle-8.13/bin/gradle" --no-daemon :app:assembleRelease
          python - <<'PY'
          import pathlib, zipfile
          apk = pathlib.Path("app/build/outputs/apk/release/app-release-unsigned.apk")
          assert 0 < apk.stat().st_size <= 64 * 1024 * 1024
          with zipfile.ZipFile(apk) as package:
              for abi in ("arm64-v8a", "x86_64"):
                  for engine in ("naive", "xray"):
                      assert package.getinfo(f"lib/{abi}/lib{engine}.so").file_size > 0
              assert package.testzip() is None
          PY
  python-network:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: android/src
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install native test headers and Python dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libcap-dev zlib1g-dev
          python -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt
      - name: Build isolated native fixtures and run Python suite
        run: bash scripts/test-network.sh
