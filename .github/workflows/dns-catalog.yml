name: Validate DNS catalogs

on:
  push:
    paths:
      - dns-profiles.json
      - services.json
      - update-trust.json
      - scripts/validate_catalogs.py
      - testdata/**
      - android/src/app/src/main/python/services.json
      - windows/src/internal/core/services.json
      - windows/src/internal/core/update_trust.json
      - android/src/app/src/main/java/dev/graybridge/UpdateTrust.java
      - android/src/app/src/main/python/dns_profiles.py
      - android/src/app/src/main/python/dns_profiles.json
      - windows/src/internal/core/dns_profiles.json
      - .github/workflows/dns-catalog.yml
  pull_request:
    paths:
      - dns-profiles.json
      - services.json
      - update-trust.json
      - scripts/validate_catalogs.py
      - testdata/**
      - android/src/app/src/main/python/services.json
      - windows/src/internal/core/services.json
      - windows/src/internal/core/update_trust.json
      - android/src/app/src/main/java/dev/graybridge/UpdateTrust.java
      - android/src/app/src/main/python/dns_profiles.py
      - android/src/app/src/main/python/dns_profiles.json
      - windows/src/internal/core/dns_profiles.json
      - .github/workflows/dns-catalog.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate public endpoints and catalog limits
        env:
          PYTHONPATH: android/src/app/src/main/python
        run: |
          python scripts/validate_catalogs.py
