name: Validate Windows release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Normal release tag; empty uses windows-update.json'
        required: false
        type: string
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Download tagged packages and verify checksums
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $tag = $env:RELEASE_TAG
          if (-not $tag) {
            $feed = Get-Content windows-update.json -Raw | ConvertFrom-Json
            $tag = ([Uri]$feed.url).AbsolutePath.Split('/')[3]
          }
          if ($tag -notmatch '^windows-v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'A normal Windows release tag is required' }
          $version = $tag.Substring('windows-v'.Length)
          $base = "https://raw.githubusercontent.com/${{ github.repository }}/$tag/windows"
          Invoke-WebRequest "$base/SHA256SUMS.txt" -OutFile SHA256SUMS.txt
          foreach ($name in @("SorryRKN-Windows-$version.zip", "SorryRKN-Windows-$version-Setup.exe")) {
            Invoke-WebRequest "$base/$name" -OutFile $name
            $expected = (Get-Content SHA256SUMS.txt | Where-Object { $_.EndsWith("  $name") }).Split(' ')[0]
            if (-not $expected -or (Get-FileHash -LiteralPath $name -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw "Checksum mismatch: $name" }
          }
          Expand-Archive "SorryRKN-Windows-$version.zip" -DestinationPath app
          ./windows/validate.ps1 -AppDir "$PWD/app/SorryRKN" -InstallerPath "$PWD/SorryRKN-Windows-$version-Setup.exe" -IsolatedTestMachine
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-validation
          path: |
            validation-results.json
            windows-screen.png
            windows-rules.png
            windows-service-routes.png
          if-no-files-found: warn
