name: Validate Windows source

on:
  push:
    branches:
      - main
      - 'codex/**'
    paths:
      - 'windows/src/**'
      - '.github/workflows/windows-source.yml'
  pull_request:
    paths:
      - 'windows/src/**'
      - '.github/workflows/windows-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-source:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
        working-directory: windows/src
    steps:
      - name: Check out current source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: windows/src/go.mod
          cache-dependency-path: windows/src/go.sum

      - name: Set up verified portable NSIS
        run: |
          New-Item -ItemType Directory -Force dist/ci-logs | Out-Null
          Start-Transcript -Path dist/ci-logs/setup-nsis.log
          try {
            & ./scripts/setup-nsis.ps1
          } finally {
            Stop-Transcript
          }

      - name: Hydrate runtime and build current package
        run: |
          New-Item -ItemType Directory -Force dist/ci-logs | Out-Null
          Start-Transcript -Path dist/ci-logs/build.log
          try {
            & ./scripts/build.ps1
            foreach ($artifact in @('dist/SorryRKN-Windows-1.4.0.zip', 'dist/SorryRKN-Windows-1.4.0-Setup.exe')) {
              if (-not (Test-Path -LiteralPath $artifact -PathType Leaf)) { throw "Missing Windows package: $artifact" }
            }
          } finally {
            Stop-Transcript
          }

      - name: Run Go tests
        run: |
          go test -v ./... 2>&1 | Tee-Object -FilePath dist/ci-logs/go-test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test update-signing backup and restore with disposable keys
        run: ../../tools/tests/Update-Signing.Tests.ps1

      - name: Authenticate production JSON metadata offline
        run: |
          foreach ($name in @('update.json','windows-update.json','dns-profiles.json')) {
            & ./dist/check-network.exe -verify-data "../../$name" -output "dist/ci-logs/verified-$name"
            if ($LASTEXITCODE -ne 0) { throw "Metadata signature verification failed: $name" }
          }

      - name: Vet core and Windows platform
        run: |
          go vet ./internal/core ./internal/platform 2>&1 | Tee-Object -FilePath dist/ci-logs/go-vet.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run offline Telegram protocol tests with bundled Python
        run: |
          & ./runtime/python/python.exe -m unittest discover -s runtime/app -p 'test_*.py' -v 2>&1 | Tee-Object -FilePath dist/ci-logs/python-test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload tested Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: windows-source-packages
          path: |
            windows/src/dist/SorryRKN-Windows-1.4.0.zip
            windows/src/dist/SorryRKN-Windows-1.4.0-Setup.exe
          if-no-files-found: error
          compression-level: 0

      - name: Upload build and test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-source-validation
          path: |
            windows/src/dist/ci-logs/*.log
            windows/src/dist/ci-logs/verified-*.json
            windows/src/VALIDATION.md
          if-no-files-found: warn

  native-validation:
    needs: windows-source
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with:
          name: windows-source-packages
          path: native-packages
      - name: Validate native driver, application and installer in isolated runner
        shell: pwsh
        run: |
          $zip = Get-ChildItem native-packages -Filter 'SorryRKN-Windows-*.zip' -Recurse | Select-Object -First 1
          $setup = Get-ChildItem native-packages -Filter 'SorryRKN-Windows-*-Setup.exe' -Recurse | Select-Object -First 1
          if (-not $zip -or -not $setup) { throw 'Missing built package' }
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath native-app
          ./windows/validate.ps1 -AppDir "$PWD/native-app/SorryRKN" -InstallerPath $setup.FullName -IsolatedTestMachine
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-native-validation
          path: |
            validation-results.json
            windows-screen.png
            windows-rules.png
            windows-service-routes.png
            native-app/SorryRKN/VALIDATION.md
          if-no-files-found: warn
